onboarding = false
# herdr configuration (migrated from .tmux.conf)

[keys]
# tmux: set -g prefix C-t
prefix = "ctrl+t"

# tmux: bind d detach-client （既定の prefix+q から変更）
detach = "prefix+d"

# ペイン移動 h/j/k/l は herdr 既定が prefix+h/j/k/l で tmux(vi風)と一致するため設定不要
# reload は既定 prefix+shift+r（prefix+r は resize_mode のため衝突回避で既定を維持）

# エージェント切り替え（workspace/tab をまたいで agent 単位で移動）
# 既定は未設定。pane 移動(h/j/k/l)や tab(p/n)と衝突しないキーを割当。
previous_agent = "prefix+shift+k"   # 前のエージェントへ
next_agent = "prefix+shift+j"       # 次のエージェントへ
focus_agent = "prefix+alt+1..9"     # N 番目のエージェントへ直接ジャンプ

[[keys.command]]
key = "prefix+alt+s"
type = "popup"
command = "$HOME/bin/herdr-agent-status-log show; printf '\\npress enter to close '; read _"
description = "show agent status change log"
width = "90%"
height = "70%"

[terminal]
# tmux: default-shell $SHELL → herdr 既定が $SHELL のため指定不要

[ui]
# tmux: mouse on → 既定 true
mouse_capture = true

agent_panel_sort = "spaces"
[ui.sidebar.agents]
rows = [
  ["state_icon", "state_text", "$status_since"],
  ["workspace", "tab"],
  ["agent"],
]

[experimental]
# 日本語IME併用対策（prefix が ctrl+t のため推奨）
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true

[theme]
name = "tokyo-night"
auto_switch = false

# バックグラウンドのエージェント状態変化をmacOS通知センターに直接出す
[ui.toast]
delivery = "system"
delay_seconds = 1

# 状態変化時にサウンドも鳴らす（done=完了 / request=要対応）
[ui.sound]
enabled = true
