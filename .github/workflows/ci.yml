name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run make deploy
        run: make deploy

      - name: Verify symlinks
        run: |
          grep -q "path = $PWD/gitconfig" "$HOME/.gitconfig"
          grep -qx "source $PWD/zshrc" "$HOME/.zshrc"
          test "$(git config --get user.name)" = habakan
          test -L "$HOME/.tmux.conf"
          test -L "$HOME/.vimrc"
          test -L "$HOME/.config/nvim"
          echo "All symlinks created successfully"
