set -g prefix C-t

# Default shell
set -g default-shell $SHELL

# Enable 256 colors and TrueColor (common settings)
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

set-window-option -g mode-keys vi

# Copy mode key bindings (vi style)
bind -T copy-mode-vi v send-keys -X begin-selection

# Clipboard integration (macOS: pbcopy, Linux: xclip)
if-shell "uname | grep -q Darwin" {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
    bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
}

# Enable mouse
set -g mouse on

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Development layout: C-t D (nvim left 60% | claude right 40%)
bind D source-file ~/.tmux/dev-layout.conf

# Sixel passthrough support
set -g allow-passthrough on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'multi-io/tmux-search-panes'

# tmux-fzf settings
TMUX_FZF_LAUNCH_KEY="f"  # prefix + f で起動

# Load local settings (machine-specific overrides)
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"

# Initialize tpm (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
