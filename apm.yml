name: dotfiles
version: 1.0.0
description: APM project for dotfiles
author: habakan
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: vscode, agents, copilot, claude, cursor, opencode, codex,
# gemini, antigravity, windsurf, kiro, agent-skills, all
targets:
- claude
- codex
# apm は「外部スキルの取得」専用。
# 自作スキル(habakan/skills)は ~/work/skills を直接編集し、Makefile の
# `make skills` が symlink する。apm を通すとコピーが増え source of truth が曖昧になる。
dependencies:
  apm:
  - nulab/bee/skills/using-bee#276f55c7
  mcp: []
includes: []
scripts: {}
